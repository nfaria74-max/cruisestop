<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#062f73"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icon-192.png"><link rel="icon" type="image/png" href="assets/icon-192.png"><link rel="stylesheet" href="styles.css?v=253"><link rel="stylesheet" href="styles-route.css?v=253"><link rel="stylesheet" href="styles-ux-optimized.css?v=253"><script src="ux-performance.js?v=253" defer></script><title>Pagamento confirmado - CruiseStop</title><link rel="stylesheet" href="mobile-scroll-fix.css?v=254"><script src="mobile-scroll-touch.js?v=254" defer></script></head><body><div id="app" class="route-container"><div class="route-column" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;gap:1.5rem;padding:2rem;"><div id="stateLoading"><div class="spinner"></div><p style="color:rgba(255,255,255,.82);margin-top:1rem;">A verificar o pagamento...</p></div><div id="stateSuccess" style="display:none;"><div style="font-size:4rem;margin-bottom:.5rem;">&#127881;</div><h1 style="color:#FFC107;font-size:1.6rem;margin-bottom:.5rem;">Pagamento confirmado!</h1><p style="color:rgba(255,255,255,.9);margin-bottom:2rem;">A sua rota está pronta. Aproveite o Funchal!</p><button id="startBtn" class="next-stop-btn" style="font-size:1.1rem;padding:1rem 2rem;">COMEÇAR A MINHA ROTA →</button><p style="color:rgba(255,255,255,.65);font-size:.85rem;margin-top:1.5rem;">Acesso guardado neste dispositivo durante 30 dias.</p></div><div id="stateError" style="display:none;"><div style="font-size:3rem;margin-bottom:.5rem;">!</div><h1 style="color:#ff6b6b;font-size:1.4rem;margin-bottom:.5rem;">Algo correu mal</h1><p style="color:rgba(255,255,255,.82);margin-bottom:2rem;" id="errorMsg">Não foi possível verificar o pagamento.</p><button onclick="window.location.href='index_pt.html'" class="action-btn secondary">Voltar ao início</button><p style="color:rgba(255,255,255,.65);font-size:.85rem;margin-top:1rem;">Se lhe foi cobrado algum valor, contacte-nos por WhatsApp.</p></div></div></div><style>.spinner{width:48px;height:48px;border:4px solid rgba(255,255,255,.15);border-top-color:#FFC107;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}@keyframes spin{to{transform:rotate(360deg)}}</style><script>const ROUTE_PAGES={relax:'relex_pt.html',foodie:'foddie_pt.html',panoramic:'panoramic_pt.html'};const params=new URLSearchParams(window.location.search);const sessionId=params.get('session_id');async function verifyPayment(){if(!sessionId){showError('Sessão de pagamento não encontrada.');return;}try{const res=await fetch('/verify?session_id='+encodeURIComponent(sessionId));const data=await res.json();if(data.paid&&data.route&&ROUTE_PAGES[data.route]){const expiry=Number(data.accessExpiresAt)||Date.now()+30*24*60*60*1000;if(data.customerEmail)localStorage.setItem('cruisestop_customer_email',data.customerEmail);localStorage.setItem('access_'+data.route,JSON.stringify({expiry:expiry,sessionId:sessionId}));showSuccess(data.route);}else{showError('Pagamento não confirmado. Tente novamente ou contacte o suporte.');}}catch(err){showError('Não foi possível contactar o servidor. Verifique a ligação e tente novamente.');}}function showSuccess(route){document.getElementById('stateLoading').style.display='none';document.getElementById('stateSuccess').style.display='block';document.getElementById('startBtn').onclick=function(){window.location.href=ROUTE_PAGES[route];};}function showError(msg){document.getElementById('stateLoading').style.display='none';document.getElementById('stateError').style.display='block';document.getElementById('errorMsg').textContent=msg;}verifyPayment();</script><script src="site-update.js?v=253"></script></body></html>
