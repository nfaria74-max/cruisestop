/* ============================================================
   Dock compacto — PILOTO, so nesta pagina (Relax PT).
   Apenas CSS: nenhum id, handler, texto ou dado foi alterado.
   Linha 1: Maps | Proxima paragem     (lado a lado, 50/50)
   Linha 2: timer compacto             (navio + valor + badge)
   Linha 3: Ver caminho de regresso    (largura total)
   ============================================================ */
body.route-stop-page {
  --dock-gap: 6px;
  --dock-half: calc((var(--route-dock-width) - var(--dock-gap)) / 2);
  --dock-base: calc(10px + env(safe-area-inset-bottom, 0px));
}

/* ---------- Linha 1: as duas acoes lado a lado ---------- */
body.route-stop-page #mapsBtn,
body.route-stop-page .btn-next {
  bottom: calc(var(--dock-base) + var(--route-timer-height, 128px) + var(--dock-gap)) !important;
  width: var(--dock-half) !important;
  min-width: 0 !important;
  min-height: 44px !important;
  height: 44px !important;
  padding: 0 6px !important;
  transform: none !important;
  border-radius: 14px !important;
  font-size: 13.5px !important;
  line-height: 1.15 !important;
  text-align: center !important;
  white-space: normal !important;
  overflow-wrap: anywhere !important;
  box-shadow: 0 8px 18px rgba(6, 31, 76, 0.18) !important;
}

body.route-stop-page #mapsBtn {
  left: calc(50% - var(--route-dock-width) / 2) !important;
  right: auto !important;
}

body.route-stop-page .btn-next {
  left: calc(50% + var(--dock-gap) / 2) !important;
  right: auto !important;
}

body.route-stop-page #mapsBtn:active,
body.route-stop-page .btn-next:active {
  transform: translateY(1px) scale(0.99) !important;
}

/* ---------- Linha 2 + 3: timer compacto ---------- */
body.route-stop-page .timer-widget {
  border-radius: 16px !important;
  padding: 5px 10px 6px !important;
  gap: 4px !important;
}

body.route-stop-page .timer-main {
  display: flex !important;
  align-items: center !important;
  gap: 10px !important;
  padding: 0 !important;
  margin: 0 !important;
}

body.route-stop-page .timer-ship-icon {
  flex: 0 0 auto !important;
  width: 40px !important;
}

body.route-stop-page .timer-ship-icon svg {
  max-width: 40px !important;
  max-height: 40px !important;
}

body.route-stop-page .timer-body {
  flex: 1 1 auto !important;
  min-width: 0 !important;
}

body.route-stop-page .time-remaining-label {
  font-size: 10.5px !important;
  line-height: 1 !important;
  margin: 0 !important;
}

body.route-stop-page .timer-display {
  padding: 0 !important;
  margin: 0 !important;
  border: 0 !important;
  background: none !important;
  box-shadow: none !important;
}

body.route-stop-page .timer-info {
  display: flex !important;
  flex-wrap: wrap !important;
  align-items: center !important;
  gap: 2px 8px !important;
}

body.route-stop-page .timer-value {
  order: 1 !important;
  flex: 0 0 auto !important;
  font-size: 23px !important;
  line-height: 1 !important;
  margin: 0 !important;
}

body.route-stop-page .buffer-badge {
  order: 2 !important;
  margin: 0 0 0 auto !important;
  padding: 2px 7px !important;
  font-size: 10px !important;
  line-height: 1.2 !important;
  white-space: nowrap !important;
}

body.route-stop-page .return-time {
  order: 3 !important;
  flex: 1 1 100% !important;
  font-size: 11px !important;
  line-height: 1.2 !important;
  margin: 0 !important;
}

body.route-stop-page .timer-actions {
  margin: 4px 0 0 !important;
  padding: 0 !important;
}

body.route-stop-page .timer-return-btn {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
  width: 100% !important;
  min-height: 36px !important;
  height: 36px !important;
  padding: 0 12px !important;
  background: #eef6ff !important;
  border: 1.5px solid rgba(6, 47, 115, 0.38) !important;
  color: #062f73 !important;
  font-size: 12.5px !important;
  font-weight: 700 !important;
  line-height: 1.1 !important;
  text-align: left !important;
  border-radius: 12px !important;
  box-shadow: none !important;
  transition: background .15s, border-color .15s, transform .12s !important;
}

/* icone e chevron por CSS: o textContent do JS nao os afeta */
body.route-stop-page .timer-return-btn::before {
  content: "\1F5FA\FE0F";
  flex: 0 0 auto;
  font-size: 15px;
  line-height: 1;
}

body.route-stop-page .timer-return-btn::after {
  content: "\203A";
  flex: 0 0 auto;
  margin-left: auto;
  font-size: 20px;
  line-height: 1;
  font-weight: 700;
  opacity: .7;
}

body.route-stop-page .timer-return-btn:active {
  background: #d9e9ff !important;
  border-color: #062f73 !important;
  transform: translateY(1px) scale(0.995) !important;
}

/* ---------- folga do conteudo, ajustada ao dock mais baixo ---------- */
body.route-stop-page .stop-card {
  padding-bottom: calc(200px + env(safe-area-inset-bottom, 0px)) !important;
}
