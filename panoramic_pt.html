/* ============================================================
   Dock compacto — PILOTO, so nesta pagina (Relax PT).
   Apenas CSS: nenhum id, handler, texto ou dado foi alterado.
   Linha 1: Maps | Proxima paragem     (lado a lado, 50/50)

body.route-stop-page {
  --dock-gap: 6px;
  --dock-half: calc((var(--route-dock-width) - var(--dock-gap)) / 2);
  --dock-base: calc(10px + env(safe-area-inset-bottom, 0px));
}

/* ---------- Linha 1: as duas acoes lado a lado ---------- */
body.route-stop-page #mapsBtn,

  height: 44px !important;
  padding: 0 6px !important;

}

body.route-stop-page #mapsBtn {
  left: calc(50% - var(--route-dock-width) / 2) !important;
  right: auto !important;
}

body.route-stop-page .btn-next {

  right: auto !important;
}

  transform: translateY(1px) scale(0.99) !important;
}

<script id="route-final-label-fix-v260">
(function () {
  var cfg = window.ROUTE_CONFIG;
  if (!cfg || !cfg.stops || cfg.stops.length < 2) return;
  var scenicLast = cfg.stops[cfg.stops.length - 2];
  var returnStop = cfg.stops[cfg.stops.length - 1];
  var cathedral = cfg.stops[3];

  function syncFinalRouteLabels() {
    var title = document.getElementById('stop-title');
    var step = document.querySelector('.stop-step');
    var next = document.getElementById('nextBtn');
    var card = document.querySelector('.stop-card');
    if (!title || !step || !next || !card) return;

    var currentName = title.textContent.trim();
    var isReturn = currentName === returnStop.name;
    var isScenicLast = currentName === scenicLast.name;
    var isCathedral = cathedral && currentName === cathedral.name;

    card.classList.toggle('route-cathedral', !!isCathedral);

    if (isReturn) {
      var returnLabel = (cfg.labels && cfg.labels.returnStopLabel) || 'RETURN TO SHIP';
      if (step.textContent !== returnLabel) step.textContent = returnLabel;
      step.classList.add('route-return-label');
    } else {
      step.classList.remove('route-return-label');
    }

    if (isScenicLast) {
      var returnText = ((cfg.labels && cfg.labels.returnToShip) || 'Return to ship') + ' →';
      if (next.textContent !== returnText) next.textContent = returnText;
    }
  }

  var target = document.querySelector('.stop-card');
  if (target) {
    new MutationObserver(syncFinalRouteLabels).observe(target, {subtree:true, childList:true, characterData:true});
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', syncFinalRouteLabels, {once:true});
  } else {
    syncFinalRouteLabels();
  }
  setTimeout(syncFinalRouteLabels, 0);
})();
</script></body></html>
