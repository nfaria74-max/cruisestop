/* ============================================================

   Apenas CSS: nenhum id, handler, texto ou dado foi alterado.

body.route-stop-page {
  --dock-gap: 6px;
  --dock-half: calc((var(--route-dock-width) - var(--dock-gap)) / 2);

body.route-stop-page .btn-next {

  right: auto !important;
}

body.route-stop-page .btn-next {

}

<script id="taste-route-extras-script-v264">
(function () {
  var firstStopName = 'UAUCACAU – Queimada';
  var finalTasteName = 'CACO Factory + Rei da Poncha';
  var returnStopName = 'Funchal Cruise Port';
  var originalOpenInGoogleMaps = window.openInGoogleMaps;

  if (typeof originalOpenInGoogleMaps !== 'function') return;

  var firstLegDestination =
    'UAUCACAU, Rua da Queimada de Baixo 11, Funchal, Madeira';

  var firstLegWaypoints =
    'Golden Gate Grand Café, Funchal, Madeira|' +
    'Sé Catedral, Funchal, Madeira';

  var firstLegUrl =
    'https://www.google.com/maps/dir/?api=1' +
    '&destination=' + encodeURIComponent(firstLegDestination) +
    '&waypoints=' + encodeURIComponent(firstLegWaypoints) +
    '&travelmode=walking&dir_action=navigate';

  var extraUrl =
    'https://www.google.com/maps/dir/?api=1' +
    '&destination=' + encodeURIComponent(
      'Fábrica Santo António, Travessa do Forno, Funchal, Madeira'
    ) +
    '&travelmode=walking&dir_action=navigate';

  var whyBox = document.querySelector('.stop-why');
  var stopActions = document.querySelector('.stop-actions');

  if (!whyBox || !stopActions) return;

  var firstLeg = document.createElement('div');
  firstLeg.id = 'tasteFirstLeg';
  firstLeg.className = 'taste-first-leg';
  firstLeg.innerHTML =
    '<strong>Before your first taste</strong>' +
    '<span>Walk through the city centre via Golden Gate and Sé Cathedral before arriving at UAUCACAU.</span>';

  whyBox.insertAdjacentElement('afterend', firstLeg);

  var extra = document.createElement('aside');
  extra.id = 'tasteExtraCard';
  extra.className = 'taste-extra-card';
  extra.innerHTML =
    '<strong>Taste Extra — Fábrica Santo António</strong>' +
    '<img src="images/FOODIE/taste-fabrica-santo-antonio.jpg" alt="Fábrica Santo António">' +
    '<p class="taste-extra-note">Optional stop for traditional Madeira sweets. Buy something if you like — you can enjoy it later.</p>' +
    '<button class="btn btn-secondary taste-extra-btn" type="button" onclick="openTasteExtra()">Open Taste Extra in Maps</button>';

  stopActions.insertAdjacentElement('afterend', extra);

  window.openTasteExtra = function () {
    window.location.href = extraUrl;
  };

  window.openInGoogleMaps = function () {
    var title = document.getElementById('stop-title');
    var currentName = title ? title.textContent.trim() : '';

    if (currentName === firstStopName) {
      window.location.href = firstLegUrl;
      return;
    }

    return originalOpenInGoogleMaps.apply(this, arguments);
  };

  function syncTasteExtras() {
    var title = document.getElementById('stop-title');
    var currentName = title ? title.textContent.trim() : '';
    var isFirst = currentName === firstStopName;
    var isFinalTaste = currentName === finalTasteName;
    var isReturn = currentName === returnStopName;

    var mapsBtn = document.getElementById('mapsBtn');
    var nextBtn = document.getElementById('nextBtn');
    var step = document.querySelector('.stop-step');
    var counter = document.querySelector('.stop-counter');

    firstLeg.hidden = !isFirst;
    extra.hidden = !isFirst;

    if (mapsBtn) {
      mapsBtn.textContent = isFirst
        ? 'Walk via Golden Gate + Cathedral'
        : ((window.ROUTE_CONFIG.labels &&
            window.ROUTE_CONFIG.labels.navigateHere) ||
           'Open in Google Maps');
    }

    if (nextBtn && isFinalTaste) {
      nextBtn.textContent = 'Return to ship →';
      nextBtn.onclick = window.nextStop;
    }

    if (step) {
      if (isReturn) {
        step.textContent = 'RETURN TO\nSHIP';
        step.classList.add('route-return-label');
      } else {
        step.classList.remove('route-return-label');
      }
    }

    if (counter && isReturn) {
      counter.textContent = '3/3';
    }
  }

  syncTasteExtras();

  var titleNode = document.getElementById('stop-title');
  if (titleNode) {
    new MutationObserver(syncTasteExtras).observe(titleNode, {
      childList:true,
      characterData:true,
      subtree:true
    });
  }
})();
</script><script src="site-update.js?v=253"></script></body></html>
